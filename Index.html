<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Social Media with no AI Slop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .snap-container {
            height: 100vh;
            height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .snap-container::-webkit-scrollbar {
            display: none;
        }
        .snap-item {
            height: 100vh;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
        }
    </style>
</head>
<body class="bg-black text-white">

    <!-- Top Header Overlay -->
    <div class="fixed top-0 left-0 right-0 z-30 flex justify-between items-center px-4 py-3 bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
        <h1 class="font-bold text-lg tracking-wider text-rose-500">HUMAN//FEED</h1>
        <div class="text-xs bg-zinc-800/80 px-2 py-1 rounded-full text-zinc-300 border border-zinc-700 pointer-events-auto">
            AI Slop Deleted
        </div>
    </div>

    <!-- TikTok Style Full-Screen Vertical Feed -->
    <div id="feed-container" class="snap-container">
        <!-- Dynamic posts will load here -->
        <div class="snap-item flex items-center justify-center text-zinc-500">
            Connecting to Supabase...
        </div>
    </div>

    <!-- Floating Action Button to Post -->
    <button onclick="openPostModal()" class="fixed bottom-6 right-6 z-40 bg-rose-600 hover:bg-rose-500 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg text-2xl transition transform active:scale-95">
        +
    </button>

    <!-- Post Creation Modal -->
    <div id="post-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-2xl p-5 relative">
            <h2 class="text-lg font-bold mb-3 text-rose-500">Create Human Post</h2>
            <p class="text-xs text-zinc-400 mb-3">Posts containing AI buzzwords (e.g. "delve", "testament", "tapestry", "revolutionize") will be automatically rejected and deleted.</p>
            <textarea id="post-content" rows="4" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-white focus:outline-none focus:border-rose-600 placeholder-zinc-600 text-sm" placeholder="Write something real..."></textarea>
            <input type="text" id="post-author" placeholder="Your Name / Handle" class="w-full mt-3 bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-white focus:outline-none focus:border-rose-600 placeholder-zinc-600 text-sm">
            
            <div id="error-banner" class="mt-3 hidden bg-red-950/80 border border-red-800 text-red-200 text-xs p-3 rounded-xl"></div>

            <div class="flex justify-end gap-3 mt-4">
                <button onclick="closePostModal()" class="px-4 py-2 rounded-xl bg-zinc-800 text-zinc-300 text-sm hover:bg-zinc-700">Cancel</button>
                <button onclick="submitPost()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-sm hover:bg-rose-500 font-medium">Post to Feed</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Initialization using your provided keys
        const SUPABASE_URL = "https://seryrxjpieeqkgovpsgi.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_X-7M-jh786pow0K9hwl0vQ_5DWIlGVD";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        // Strict AI-Slop Buzzer List
        const AI_BUZZWORDS = [
            "delve", "testament", "tapestry", "revolutionize", "beacon", 
            "furthermore", "in conclusion", "realm", "delve into", "paramount", 
            "unleash", "elevate", "cutting-edge", "game-changer", "meticulous"
        ];

        function isAISlop(text) {
            const lower = text.toLowerCase();
            return AI_BUZZWORDS.some(word => lower.includes(word));
        }

        async function fetchPosts() {
            const container = document.getElementById('feed-container');
            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="snap-item flex flex-col items-center justify-center p-6 text-center text-red-400">Error loading feed: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="snap-item flex flex-col items-center justify-center p-6 text-center text-zinc-500">No posts yet. Be the first human to post!</div>`;
                return;
            }

            container.innerHTML = data.map(post => `
                <div class="snap-item flex flex-col justify-end p-6 pb-16 relative bg-zinc-950">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/30 pointer-events-none"></div>
                    <div class="relative z-10 max-w-lg">
                        <span class="text-rose-500 font-bold text-sm">@${escapeHtml(post.author || 'anonymous')}</span>
                        <p class="text-lg mt-2 leading-relaxed text-zinc-100">${escapeHtml(post.content)}</p>
                    </div>
                    <div class="absolute right-4 bottom-20 z-10 flex flex-col items-center gap-4">
                        <button onclick="likePost('${post.id}', ${post.likes || 0})" class="flex flex-col items-center text-white">
                            <div class="w-12 h-12 bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-full flex items-center justify-center text-xl active:scale-90 transition">❤️</div>
                            <span class="text-xs mt-1 text-zinc-300">${post.likes || 0}</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openPostModal() {
            document.getElementById('post-modal').classList.remove('hidden');
            document.getElementById('error-banner').classList.add('hidden');
        }

        function closePostModal() {
            document.getElementById('post-modal').classList.add('hidden');
        }

        async function submitPost() {
            const content = document.getElementById('post-content').value.trim();
            const author = document.getElementById('post-author').value.trim() || 'Anonymous';
            const errorBanner = document.getElementById('error-banner');

            if (!content) {
                errorBanner.textContent = "Please write something before posting.";
                errorBanner.classList.remove('hidden');
                return;
            }

            // Client-side AI-Slop Check & Instant Delete/Block
            if (isAISlop(content)) {
                errorBanner.textContent = "🚫 AI-Slop Detected! This post contains synthetic buzzwords and was automatically blocked/deleted.";
                errorBanner.classList.remove('hidden');
                // Auto clear text box to enforce deletion
                document.getElementById('post-content').value = "";
                return;
            }

            // Save to Supabase DB
            const { error } = await supabaseClient
                .from('posts')
                .insert([{ content, author, likes: 0 }]);

            if (error) {
                errorBanner.textContent = "Database error: " + error.message;
                errorBanner.classList.remove('hidden');
                return;
            }

            closePostModal();
            document.getElementById('post-content').value = '';
            document.getElementById('post-author').value = '';
            fetchPosts();
        }

        async function likePost(id, currentLikes) {
            await supabaseClient
                .from('posts')
                .update({ likes: currentLikes + 1 })
                .eq('id', id);
            fetchPosts();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial load
        fetchPosts();
    </script>
</body>
</html>
