<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InstaMedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .snap-container {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .snap-container::-webkit-scrollbar {
            display: none;
        }
        .snap-item {
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
        }
        /* Custom scrollbar for tablet sidebar / wall */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white flex items-center justify-center h-[100vh] h-[100dvh] w-screen overflow-hidden">

    <!-- Responsive Device Shell Container -->
    <div id="device-shell" class="w-full h-full md:max-w-md md:h-[90vh] md:max-h-[850px] md:border-[8px] md:border-zinc-800 md:rounded-[40px] bg-black flex flex-col relative shadow-2xl overflow-hidden transition-all duration-300">
        
        <!-- Mobile/Tablet Status Bar -->
        <div class="absolute top-0 left-0 right-0 z-50 flex justify-between items-center px-6 py-2.5 bg-gradient-to-b from-black/80 to-transparent pointer-events-none text-xs text-zinc-300 font-medium select-none">
            <span id="status-time">9:41</span>
            <div class="w-20 h-4 bg-black rounded-full mx-auto hidden md:block absolute left-1/2 -translate-x-1/2 top-1.5 border border-zinc-800"></div>
            <div class="flex items-center gap-1.5 pointer-events-auto">
                <span class="text-[10px]">5G</span>
                <div class="w-4 h-2.5 border border-zinc-300 rounded-sm p-0.5 flex items-center">
                    <div class="h-full w-full bg-zinc-300 rounded-2xs"></div>
                </div>
            </div>
        </div>

        <!-- Top App Navigation Header -->
        <div class="absolute top-8 left-0 right-0 z-40 flex justify-between items-center px-4 py-2 bg-gradient-to-b from-black/90 via-black/60 to-transparent pointer-events-none">
            <div class="flex items-center gap-2 pointer-events-auto">
                <h1 class="font-extrabold text-sm tracking-wider text-rose-500">INSTAMEDIA</h1>
                <div class="flex bg-zinc-900/90 border border-zinc-800 rounded-full p-0.5 text-xs">
                    <button onclick="switchTab('feed')" id="tab-feed" class="px-2.5 py-1 rounded-full bg-rose-600 text-white font-medium transition">Reels</button>
                    <button onclick="switchTab('wall')" id="tab-wall" class="px-2.5 py-1 rounded-full text-zinc-400 transition">Wall</button>
                </div>
            </div>
            <div class="flex items-center gap-2 pointer-events-auto">
                <span id="current-user-badge" class="text-[10px] bg-zinc-800 px-2 py-0.5 rounded-full text-zinc-300 border border-zinc-700 hidden max-w-[90px] truncate"></span>
                <button onclick="openAuthModal()" id="auth-btn-text" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded-full text-white font-medium shadow border border-zinc-700">Sign In</button>
            </div>
        </div>

        <!-- Main Screen Viewport (Dynamic Split for Tablet Mode vs Mobile Mode) -->
        <div id="app-viewport" class="flex-1 relative overflow-hidden flex flex-col">
            
            <!-- View 1: TikTok Style Vertical Reels Feed -->
            <div id="view-feed" class="snap-container flex-1 w-full h-full">
                <div class="snap-item flex flex-col items-center justify-center text-zinc-500">
                    Loading InstaMedia Reels...
                </div>
            </div>

            <!-- View 2: Facebook Style Community Wall Feed -->
            <div id="view-wall" class="snap-container hidden flex-1 w-full h-full pt-16 px-4 pb-20 overflow-y-auto">
                <div id="wall-container" class="max-w-md mx-auto space-y-4">
                    <!-- Community Wall Cards Loaded Dynamically -->
                </div>
            </div>

        </div>

        <!-- Bottom Native-Style Navigation Bar -->
        <div class="absolute bottom-0 left-0 right-0 z-40 bg-zinc-950/95 backdrop-blur-md border-t border-zinc-900 px-6 py-3 flex justify-around items-center">
            <button onclick="switchTab('feed')" class="flex flex-col items-center text-rose-500 gap-0.5" id="nav-btn-feed">
                <span class="text-lg">⚡</span>
                <span class="text-[10px] font-medium">Reels</span>
            </button>
            
            <button onclick="openPostModal()" class="w-11 h-11 bg-gradient-to-tr from-rose-600 to-pink-500 rounded-full flex items-center justify-center text-white text-xl shadow-lg active:scale-95 transition border border-rose-400/30">
                +
            </button>

            <button onclick="switchTab('wall')" class="flex flex-col items-center text-zinc-400 gap-0.5" id="nav-btn-wall">
                <span class="text-lg">💬</span>
                <span class="text-[10px] font-medium">Wall</span>
            </button>
        </div>

        <!-- Home Bar Indicator (Mobile Style) -->
        <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-zinc-700 rounded-full pointer-events-none z-50"></div>
    </div>

    <!-- Comments Drawer -->
    <div id="comments-modal" class="fixed inset-x-0 bottom-0 z-50 bg-zinc-900 border-t border-zinc-800 rounded-t-3xl p-5 max-h-[70vh] flex flex-col transform translate-y-full transition-transform duration-300 md:max-w-md md:mx-auto md:left-0 md:right-0">
        <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-sm text-rose-500">Comments & Discussion</h3>
            <button onclick="closeComments()" class="text-zinc-400 hover:text-white text-sm font-bold px-2">✕</button>
        </div>
        <div id="comments-list" class="overflow-y-auto flex-1 space-y-3 pr-1 mb-3 text-sm"></div>
        <div class="flex gap-2 pt-2 border-t border-zinc-800">
            <input type="text" id="comment-input" placeholder="Write a comment..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-600">
            <button onclick="submitComment()" class="bg-rose-600 px-4 py-2 rounded-xl text-sm font-medium hover:bg-rose-500">Send</button>
        </div>
    </div>

    <!-- Supabase Email Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 relative shadow-2xl">
            <h2 class="text-lg font-bold mb-1 text-rose-500">Instamedia Account</h2>
            <p class="text-xs text-zinc-400 mb-4">Sign in or create an account with your email.</p>
            
            <input type="email" id="auth-email" placeholder="Email address" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-white focus:outline-none focus:border-rose-600 placeholder-zinc-600 text-sm mb-3">
            <input type="password" id="auth-password" placeholder="Password" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-white focus:outline-none focus:border-rose-600 placeholder-zinc-600 text-sm mb-3">
            
            <div id="auth-error" class="mb-3 hidden bg-red-950/80 border border-red-800 text-red-200 text-xs p-3 rounded-xl"></div>

            <div class="flex flex-col gap-2">
                <button onclick="handleEmailSignIn()" class="w-full py-3 rounded-xl bg-rose-600 text-white text-sm hover:bg-rose-500 font-medium">Sign In</button>
                <button onclick="handleEmailSignUp()" class="w-full py-2.5 rounded-xl bg-zinc-800 text-zinc-200 text-sm hover:bg-zinc-700 font-medium">Create Account</button>
                <button onclick="closeAuthModal()" class="w-full py-2 rounded-xl bg-transparent text-zinc-500 text-xs hover:text-zinc-300">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Post Creation Modal (With Video File Preview & Supabase Storage) -->
    <div id="post-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <h2 class="text-lg font-bold mb-1 text-rose-500">Upload Video Reel</h2>
            <p class="text-xs text-zinc-400 mb-3">Select a video file and write a caption.</p>
            
            <textarea id="post-content" rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-white focus:outline-none focus:border-rose-600 placeholder-zinc-600 text-sm mb-3" placeholder="Write a video caption..."></textarea>
            
            <label class="block text-xs font-semibold text-zinc-300 mb-1">Video File (.mp4, .mov, .webm)</label>
            <input type="file" id="post-video-file" accept="video/*" onchange="previewVideo(event)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-zinc-300 text-xs mb-3 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-rose-600 file:text-white hover:file:bg-rose-500">

            <!-- Video Preview Box -->
            <div id="video-preview-container" class="mb-3 hidden">
                <p class="text-xs text-zinc-400 mb-1">Preview:</p>
                <video id="video-preview-element" class="w-full h-36 object-cover rounded-xl border border-zinc-800" controls muted></video>
            </div>

            <div id="upload-progress" class="text-xs text-rose-400 mb-3 hidden font-medium animate-pulse">⏳ Uploading video to Supabase... Please wait.</div>
            <div id="error-banner" class="mt-3 hidden bg-red-950/80 border border-red-800 text-red-200 text-xs p-3 rounded-xl"></div>

            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closePostModal()" class="px-3 py-2 rounded-xl bg-zinc-800 text-zinc-300 text-xs hover:bg-zinc-700">Cancel</button>
                <button id="publish-btn" onclick="submitPost()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs hover:bg-rose-500 font-medium">Publish Reel</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://seryrxjpieeqkgovpsgi.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_X-7M-jh786pow0K9hwl0vQ_5DWIlGVD";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUser = null;
        let activePostId = null;
        let currentTab = 'feed';

        // Update live status bar clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('status-time').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Responsive Tablet Mode detection and layout adaptation
        function checkTabletMode() {
            const shell = document.getElementById('device-shell');
            const width = window.innerWidth;
            const height = window.innerHeight;

            // If screen is large (tablet/desktop landscape or large screen), expand to tablet layout style
            if (width >= 768) {
                shell.classList.remove('md:max-w-md', 'md:h-[90vh]', 'md:max-h-[850px]', 'md:rounded-[40px]', 'md:border-[8px]');
                shell.classList.add('w-full', 'h-full', 'rounded-none', 'border-0');
            } else {
                shell.classList.add('md:max-w-md', 'md:h-[90vh]', 'md:max-h-[850px]', 'md:rounded-[40px]', 'md:border-[8px]');
                shell.classList.remove('w-full', 'h-full', 'rounded-none', 'border-0');
            }
        }
        window.addEventListener('resize', checkTabletMode);
        checkTabletMode();

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                currentUser = session.user.email;
                updateAuthUI();
            }
        }

        function updateAuthUI() {
            const badge = document.getElementById('current-user-badge');
            const btnText = document.getElementById('auth-btn-text');
            if (currentUser) {
                badge.textContent = currentUser;
                badge.classList.remove('hidden');
                btnText.textContent = "Sign Out";
            } else {
                badge.classList.add('hidden');
                btnText.textContent = "Sign In";
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const feedView = document.getElementById('view-feed');
            const wallView = document.getElementById('view-wall');
            const btnFeed = document.getElementById('tab-feed');
            const btnWall = document.getElementById('tab-wall');
            const navFeed = document.getElementById('nav-btn-feed');
            const navWall = document.getElementById('nav-btn-wall');

            if (tab === 'feed') {
                feedView.classList.remove('hidden');
                wallView.classList.add('hidden');
                btnFeed.className = "px-2.5 py-1 rounded-full bg-rose-600 text-white font-medium transition";
                btnWall.className = "px-2.5 py-1 rounded-full text-zinc-400 transition";
                navFeed.className = "flex flex-col items-center text-rose-500 gap-0.5";
                navWall.className = "flex flex-col items-center text-zinc-400 gap-0.5";
                fetchPosts();
            } else {
                feedView.classList.add('hidden');
                wallView.classList.remove('hidden');
                btnWall.className = "px-2.5 py-1 rounded-full bg-rose-600 text-white font-medium transition";
                btnFeed.className = "px-2.5 py-1 rounded-full text-zinc-400 transition";
                navWall.className = "flex flex-col items-center text-rose-500 gap-0.5";
                navFeed.className = "flex flex-col items-center text-zinc-400 gap-0.5";
                fetchWallPosts();
            }
        }

        const AI_BUZZWORDS = [
            "delve", "testament", "tapestry", "revolutionize", "beacon", 
            "furthermore", "in conclusion", "realm", "delve into", "paramount", 
            "unleash", "elevate", "cutting-edge", "game-changer", "meticulous"
        ];

        function isAISlop(text) {
            const lower = text.toLowerCase();
            return AI_BUZZWORDS.some(word => lower.includes(word));
        }

        async function fetchPosts() {
            const container = document.getElementById('view-feed');
            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="snap-item flex flex-col items-center justify-center p-6 text-center text-red-400">Database Error: (${error.message})</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="snap-item flex flex-col items-center justify-center p-6 text-center text-zinc-500">No reels yet. Tap '+' below to post your first video!</div>`;
                return;
            }

            container.innerHTML = data.map(post => `
                <div class="snap-item flex flex-col justify-end p-6 pb-24 relative bg-zinc-950">
                    ${post.video_url ? `<video src="${post.video_url}" class="absolute inset-0 w-full h-full object-cover" autoplay loop muted playsinline></video>` : ''}
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-black/40 pointer-events-none"></div>
                    <div class="relative z-10 max-w-sm">
                        <span class="text-rose-500 font-bold text-sm">@${escapeHtml(post.author ? post.author.split('@')[0] : 'anonymous')}</span>
                        <p class="text-sm sm:text-base mt-1.5 leading-relaxed text-zinc-100">${escapeHtml(post.content || '')}</p>
                    </div>
                    <div class="absolute right-4 bottom-28 z-10 flex flex-col items-center gap-4">
                        <button onclick="likePost('${post.id}', ${post.likes || 0})" class="flex flex-col items-center text-white">
                            <div class="w-11 h-11 bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-full flex items-center justify-center text-lg active:scale-90 transition">❤️</div>
                            <span class="text-[10px] mt-1 text-zinc-300 font-medium">${post.likes || 0}</span>
                        </button>
                        <button onclick="openComments('${post.id}')" class="flex flex-col items-center text-white">
                            <div class="w-11 h-11 bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-full flex items-center justify-center text-lg active:scale-90 transition">💬</div>
                            <span class="text-[10px] mt-1 text-zinc-300 font-medium">Chat</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function fetchWallPosts() {
            const container = document.getElementById('wall-container');
            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error || !data) {
                container.innerHTML = `<div class="text-center text-zinc-500">Error loading wall.</div>`;
                return;
            }

            container.innerHTML = data.map(post => `
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-rose-500 font-bold text-xs">@${escapeHtml(post.author ? post.author.split('@')[0] : 'anonymous')}</span>
                        <span class="text-[10px] text-zinc-500">${new Date(post.created_at).toLocaleDateString()}</span>
                    </div>
                    ${post.video_url ? `<video src="${post.video_url}" class="w-full h-52 object-cover rounded-xl mt-1" controls></video>` : ''}
                    <p class="text-zinc-200 text-xs leading-relaxed">${escapeHtml(post.content || '')}</p>
                    <div class="flex gap-4 pt-2 border-t border-zinc-800 text-[11px] text-zinc-400">
                        <button onclick="likePost('${post.id}', ${post.likes || 0})" class="hover:text-white">❤️ ${post.likes || 0} Likes</button>
                        <button onclick="openComments('${post.id}')" class="hover:text-white">💬 Comments</button>
                    </div>
                </div>
            `).join('');
        }

        async function openComments(postId) {
            activePostId = postId;
            document.getElementById('comments-modal').classList.remove('translate-y-full');
            loadComments(postId);
        }

        function closeComments() {
            document.getElementById('comments-modal').classList.add('translate-y-full');
            activePostId = null;
        }

        async function loadComments(postId) {
            const list = document.getElementById('comments-list');
            list.innerHTML = `<div class="text-zinc-500 text-center py-4 text-xs">Loading comments...</div>`;
            
            const { data, error } = await supabaseClient
                .from('comments')
                .select('*')
                .eq('post_id', postId)
                .order('created_at', { ascending: true });

            if (error || !data || data.length === 0) {
                list.innerHTML = `<div class="text-zinc-500 text-center py-4 text-xs">No comments yet. Start the conversation!</div>`;
                return;
            }

            list.innerHTML = data.map(c => `
                <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-800">
                    <span class="text-rose-500 font-bold text-[10px]">@${escapeHtml(c.author ? c.author.split('@')[0] : 'anon')}</span>
                    <p class="text-zinc-300 text-xs mt-0.5">${escapeHtml(c.content)}</p>
                </div>
            `).join('');
        }

        async function submitComment() {
            if (!currentUser) {
                alert("Please sign in first!");
                openAuthModal();
                return;
            }
            const input = document.getElementById('comment-input');
            const content = input.value.trim();
            if (!content || !activePostId) return;

            if (isAISlop(content)) {
                alert("🚫 AI-Slop Detected! Comment blocked.");
                input.value = "";
                return;
            }

            await supabaseClient.from('comments').insert([{
                post_id: activePostId,
                author: currentUser,
                content: content
            }]);

            input.value = '';
            loadComments(activePostId);
        }

        function openAuthModal() {
            if (currentUser) {
                supabaseClient.auth.signOut().then(() => {
                    currentUser = null;
                    updateAuthUI();
                    alert("Signed out successfully.");
                });
                return;
            }
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('auth-error').classList.add('hidden');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        async function handleEmailSignIn() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorDiv = document.getElementById('auth-error');

            if (!email || !password) {
                errorDiv.textContent = "Please fill in email and password.";
                errorDiv.classList.remove('hidden');
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                return;
            }

            currentUser = data.user.email;
            updateAuthUI();
            closeAuthModal();
            if(currentTab === 'feed') fetchPosts(); else fetchWallPosts();
        }

        async function handleEmailSignUp() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorDiv = document.getElementById('auth-error');

            if (!email || !password) {
                errorDiv.textContent = "Please fill in email and password.";
                errorDiv.classList.remove('hidden');
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                return;
            }

            alert("Account created! You can now sign in.");
        }

        function openPostModal() {
            if (!currentUser) {
                alert("Please sign in first!");
                openAuthModal();
                return;
            }
            document.getElementById('post-modal').classList.remove('hidden');
            document.getElementById('error-banner').classList.add('hidden');
            document.getElementById('upload-progress').classList.add('hidden');
            document.getElementById('video-preview-container').classList.add('hidden');
            document.getElementById('post-video-file').value = '';
            document.getElementById('post-content').value = '';
        }

        function closePostModal() {
            document.getElementById('post-modal').classList.add('hidden');
        }

        function previewVideo(event) {
            const file = event.target.files[0];
            const previewContainer = document.getElementById('video-preview-container');
            const previewElement = document.getElementById('video-preview-element');

            if (file) {
                const fileURL = URL.createObjectURL(file);
                previewElement.src = fileURL;
                previewContainer.classList.remove('hidden');
            } else {
                previewContainer.classList.add('hidden');
            }
        }

        async function submitPost() {
            const content = document.getElementById('post-content').value.trim();
            const videoFileInput = document.getElementById('post-video-file');
            const errorBanner = document.getElementById('error-banner');
            const progressIndicator = document.getElementById('upload-progress');
            const publishBtn = document.getElementById('publish-btn');

            if (videoFileInput.files.length === 0) {
                errorBanner.textContent = "Please select a video file!";
                errorBanner.classList.remove('hidden');
                return;
            }

            if (isAISlop(content)) {
                errorBanner.textContent = "🚫 AI-Slop Detected! Post contains blocked buzzwords.";
                errorBanner.classList.remove('hidden');
                return;
            }

            try {
                publishBtn.disabled = true;
                progressIndicator.classList.remove('hidden');
                errorBanner.classList.add('hidden');

                const file = videoFileInput.files[0];
                const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_.-]/g, '_')}`;

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('videos')
                    .upload(fileName, file);

                if (uploadError) {
                    throw new Error("Storage Upload Error: " + uploadError.message);
                }

                const { data: publicUrlData } = supabaseClient.storage
                    .from('videos')
                    .getPublicUrl(fileName);

                const videoUrl = publicUrlData.publicUrl;

                const { error: dbError } = await supabaseClient
                    .from('posts')
                    .insert([{ content, video_url: videoUrl, author: currentUser, likes: 0 }]);

                if (dbError) {
                    throw new Error("Database Error: " + dbError.message);
                }

                closePostModal();
                if(currentTab === 'feed') fetchPosts(); else fetchWallPosts();
            } catch (err) {
                errorBanner.textContent = err.message;
                errorBanner.classList.remove('hidden');
            } finally {
                progressIndicator.classList.add('hidden');
                publishBtn.disabled = false;
            }
        }

        async function likePost(id, currentLikes) {
            await supabaseClient
                .from('posts')
                .update({ likes: currentLikes + 1 })
                .eq('id', id);
            if(currentTab === 'feed') fetchPosts(); else fetchWallPosts();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        checkUserSession();
        fetchPosts();
    </script>
</body>
</html>
